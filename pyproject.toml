[project]
name = "kyc-workflow"
version = "0.1.0"
description = "VGB KYC periodic review workflow prototype: evidence pack and pre-submit check"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "langchain-community==0.4.1",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyc_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls the live Claude API through the gateway; needs ANTHROPIC_API_KEY in .env",
]
